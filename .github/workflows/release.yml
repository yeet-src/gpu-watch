name: release

# A tag v* builds the probe with the vendored toolchain, packs the
# runtime, and publishes gpu-watch.tar.gz on a GitHub release, so a
# host can `yeet service import` it from the release URL with no
# toolchain of its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make pack
        run: make pack
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" gpu-watch.tar.gz \
            --title "gpu-watch ${GITHUB_REF_NAME}" \
            --notes "yeet service import https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/gpu-watch.tar.gz --now"
